[project]
name = "pricelens"
version = "0.1.0"
description = "Evidence-first EU inflation intelligence built on Eurostat HICP and HBS."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "certifi>=2026.10.23",
    "duckdb>=1.1",
    "fastexcel>=0.21.0",
    "polars>=1.20",
    "pydantic>=2.7",
    "pyyaml>=6",
    "scikit-learn>=1.9.1",
    "statsmodels>=0.15.0",
]

[project.scripts]
pricelens = "pricelens.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pricelens"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # ruff format governs layout; long lines are report strings

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
